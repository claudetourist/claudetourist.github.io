<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ritesh Jethmalani</title>
<meta name="description" content="Ritesh Jethmalani: Senior Software Engineer, 15+ years building secure, large-scale cloud and data systems at Microsoft, Amazon and GE.">
<meta name="theme-color" content="#0a0d0c">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230a0d0c'/><text x='12' y='44' font-family='monospace' font-size='30' font-weight='700' fill='%235eead4'>&gt;_</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0d0c;--win:#0f1312;--bar:#161b19;--line:#232a27;
  --text:#d7dcd9;--muted:#7d8984;--dim:#55605b;
  --green:#5eead4;--yellow:#facc15;--pink:#f472b6;--blue:#7dd3fc;--orange:#fb923c;--red:#f87171;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 var(--mono);overflow-x:hidden;
  background-image:radial-gradient(1200px 600px at 80% -10%,rgba(94,234,212,.08),transparent 60%),
                   radial-gradient(900px 500px at -10% 110%,rgba(244,114,182,.06),transparent 60%);
  display:flex;flex-direction:column;align-items:center;padding:clamp(10px,4vh,48px) 16px;}
a{color:var(--blue);text-decoration:none;border-bottom:1px dashed rgba(125,211,252,.4)}
a:hover{color:var(--green);border-bottom-color:var(--green)}
.win{width:100%;max-width:920px;flex:1;min-height:0;min-width:0;display:flex;flex-direction:column;
  background:var(--win);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  box-shadow:0 30px 80px -20px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.02) inset}
.bar{display:flex;align-items:center;gap:8px;padding:11px 14px;background:var(--bar);border-bottom:1px solid var(--line);user-select:none}
.dot{width:12px;height:12px;border-radius:50%}
.dot.r{background:#ff5f57}.dot.y{background:#febc2e}.dot.g{background:#28c840}
.bar .title{flex:1;text-align:center;color:var(--muted);font-size:13px;margin-right:52px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#screen{flex:1;overflow-y:auto;padding:18px 20px 8px;scroll-behavior:smooth;cursor:text}
#screen::-webkit-scrollbar{width:10px}#screen::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px}
.line{white-space:pre-wrap;word-break:break-word}
.prompt{color:var(--green);font-weight:600}
.prompt .path{color:var(--blue)}
.cmd{color:var(--text)}
.out{margin:4px 0 16px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.inrow{display:flex;align-items:baseline;gap:8px;padding:0 0 14px}
.inwrap{position:relative;flex:1;min-width:0}
#in{width:100%;background:transparent;border:0;outline:0;color:var(--text);font:inherit;font-size:16px;caret-color:var(--green);padding:0}
.ghost{position:absolute;left:0;top:0;color:var(--dim);pointer-events:none;white-space:pre;font-size:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;min-width:0;padding:12px 16px;border-top:1px solid var(--line);background:var(--bar)}
.chip{font:inherit;font-size:13px;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer;transition:all .15s}
.chip:hover,.chip:focus-visible{border-color:var(--green);color:var(--green);outline:0;background:rgba(94,234,212,.06)}
.chip b{color:var(--green);font-weight:600}
/* output pieces */
.h{color:var(--yellow);font-weight:600}
.g{color:var(--green)}.b{color:var(--blue)}.p{color:var(--pink)}.o{color:var(--orange)}.m{color:var(--muted)}.r{color:var(--red)}
.fetch{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
.ascii{color:var(--green);font-weight:800;line-height:1.15;margin:0;font-size:14px;text-shadow:0 0 18px rgba(94,234,212,.35)}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);column-gap:14px;row-gap:1px}
.kv .k{color:var(--yellow)}
.swatch{display:inline-block;width:18px;height:10px;margin-right:3px;border-radius:2px}
.job{display:grid;grid-template-columns:130px minmax(0,1fr);gap:4px 18px;padding:8px 0;border-left:2px solid var(--line);padding-left:14px;margin-left:4px}
.job .when{color:var(--orange)}
.job .co{color:var(--text);font-weight:600}
.job .role{color:var(--muted)}
.job ul{margin:4px 0 0;padding-left:18px}
.job li::marker{content:"› ";color:var(--green)}
.tags span{display:inline-block;color:var(--blue);margin-right:10px}
.proj{padding:8px 0 10px}
.proj .name{color:var(--pink);font-weight:600}
.table{display:grid;grid-template-columns:max-content minmax(0,1fr);column-gap:22px;row-gap:2px}
.c{color:var(--green);cursor:pointer}
.c:hover{text-decoration:underline}
.cursor{display:inline-block;width:.6em;background:var(--green);animation:blink 1s steps(1) infinite;color:transparent}
@keyframes blink{50%{opacity:0}}
footer{color:var(--dim);font-size:12px;margin-top:12px;text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:620px){
  body{font-size:13.5px;padding:0}
  .win{border-radius:0;border-left:0;border-right:0;max-width:none}
  .bar .title{margin-right:0}
  #screen{padding:14px 14px 6px}
  .job{grid-template-columns:1fr;gap:0}
  .ascii{font-size:11px}
  .fetch{gap:14px}
  .chips{padding:10px 12px calc(10px + env(safe-area-inset-bottom));overflow-x:auto;flex-wrap:nowrap}
  .chip{flex:none}
  footer{display:none}
}
@media (prefers-reduced-motion:reduce){.out{animation:none}.cursor{animation:none}#screen{scroll-behavior:auto}}
</style>
</head>
<body>
<main class="win" aria-label="Interactive terminal portfolio">
  <div class="bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
    <div class="title">guest@riteshj: ~ — portfolio</div></div>
  <div id="screen" role="log" aria-live="polite">
    <noscript>
      <h1>Ritesh Jethmalani</h1>
      <p>Senior Software Engineer, 15+ years building secure, large-scale cloud, data and distributed systems at Microsoft, Amazon and GE.</p>
      <p><a href="https://www.linkedin.com/in/ritesh-jethmalani/">LinkedIn</a> · <a href="https://github.com/claudetourist">GitHub</a> · <a href="https://www.instagram.com/myth.learn/">Instagram</a></p>
    </noscript>
    <div id="log"></div>
    <div class="inrow" id="inrow">
      <span class="prompt" id="ps"></span>
      <div class="inwrap"><span class="ghost" id="ghost"></span>
        <label for="in" class="sr">Terminal command</label>
        <input id="in" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go"></div>
    </div>
  </div>
  <nav class="chips" id="chips" aria-label="Quick commands"></nav>
</main>
<footer>tab to autocomplete · ↑ ↓ for history · ctrl+l to clear</footer>

<script>
(() => {
const $ = s => document.querySelector(s);
const screen = $('#screen'), log = $('#log'), input = $('#in'), ghost = $('#ghost'), ps = $('#ps'), chips = $('#chips');
const PROMPT = '<span>guest@riteshj</span>:<span class="path">~</span>$';
ps.innerHTML = PROMPT;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const link = (href, text) => `<a href="${href}" target="_blank" rel="noopener">${text}</a>`;
const run = c => `<span class="c" data-run="${c}">${c}</span>`;

const LINKS = {
  linkedin: 'https://www.linkedin.com/in/ritesh-jethmalani/',
  github: 'https://github.com/claudetourist',
  instagram: 'https://www.instagram.com/myth.learn/',
};

const JOBS = [
  {when:'2022 — now', co:'Microsoft Purview', role:'Senior Software Engineer · eDiscovery, Insider Risk Management',
   pts:['Pipelines processing billions of events a day to surface insider-risk insights',
        'Led the migration of a core data store to Kusto across public and sovereign clouds, with no customer-visible incidents',
        'Long-time security owner for the product org under Microsoft’s Secure Future Initiative',
        'Tech lead on detection features; overhauled alerting for lower latency and higher throughput',
        'Builds AI-assisted engineering tools: an LLM incident-triage copilot, MCP servers, AI code review']},
  {when:'2020 — 2022', co:'Microsoft Intune', role:'Software Engineer',
   pts:['Owned core reporting infrastructure across 50+ microservices',
        'Redesigned event processing for horizontal scale and scenario isolation']},
  {when:'2014 — 2020', co:'Microsoft Azure', role:'Software Engineer · Maps, Key Vault, Bing, Site Recovery',
   pts:['Took streaming batch and matrix APIs to GA (Azure Maps)',
        'Built managed storage-account keys from preview to GA (Key Vault)',
        'Shipped SQL AlwaysOn disaster-recovery support (Site Recovery)']},
  {when:'2012 — 2014', co:'Amazon', role:'Software Developer',
   pts:['Faster data-access layer for a core e-commerce system; address-system improvements; a major country launch']},
  {when:'2011 — 2012', co:'GE · Wind Energy software', role:'Software Engineer',
   pts:['Turbine software tooling and release work']},
];

const SKILLS = [
  ['security', 'Managed Identity, secrets & key mgmt, app-level encryption, threat modeling, prod hardening'],
  ['data', 'Apache Spark, Kusto/KQL, Azure Data Factory, Event Hubs, Cosmos DB, SQL, Postgres, streaming'],
  ['cloud', 'Azure, Service Fabric, Durable Functions, microservices, REST APIs, large migrations, on-call'],
  ['ai-eng', 'Azure OpenAI, MCP servers, LLM triage tools, agent-ready repos, AI code review'],
  ['langs', 'C#/.NET, Scala, Java, C++, Python, JavaScript/TypeScript'],
];

const PROJECTS = [
  {name:'backup-hub', desc:'Windows desktop app with two jobs: reliable backups across external drives, and an index of every file so anything can be found again. Drives are recognised by name, not letter.', tags:['windows','desktop','sqlite']},
  {name:'vault', desc:'Private, local-first app for money and life admin: accounts, home, reminders, an emergency kit and full search, with encrypted backups.', tags:['local-first','encryption']},
  {name:'pm25-mumbai', desc:'Zindi “Google Mumbai Data Challenge” entry: hourly PM2.5 air-quality forecasts for four city stations from weather and pollution data, scored by RMSE.', tags:['python','ml','time-series']},
  {name:'vastu-scanner', desc:'A phone app for quick Vastu checks of a home. Open source.', tags:['mobile','oss'], href:'https://github.com/claudetourist/vastuscanner'},
];

const FILES = {'about.txt':'about','experience.log':'experience','skills.json':'skills','projects/':'projects','contact.md':'contact','mythlearn.mp4':'mythlearn'};

const C = {
  help: {d:'list available commands', f:() => `<div class="table">${
    Object.entries(C).filter(([,v])=>!v.hidden).map(([k,v])=>`${run(k)}<span class="m">${v.d}</span>`).join('')
  }</div>\n<span class="m">Tip: click any green command, press tab to autocomplete, or try</span> ${run('ls')}<span class="m">.</span>`},

  whoami: {d:'who is this guy?', f:() => `<div class="fetch"><pre class="ascii" aria-hidden="true">
 ██████╗      ██╗
 ██╔══██╗     ██║
 ██████╔╝     ██║
 ██╔══██╗██   ██║
 ██║  ██║╚█████╔╝
 ╚═╝  ╚═╝ ╚════╝</pre><div>
<div><span class="g">ritesh</span>@<span class="g">jethmalani</span></div><div class="m">──────────────────────</div>
<div class="kv"><span class="k">Name</span><span>Ritesh Jethmalani</span>
<span class="k">Role</span><span>Senior Software Engineer</span>
<span class="k">Uptime</span><span>15+ years in industry</span>
<span class="k">Hosts</span><span>Microsoft · Amazon · GE</span>
<span class="k">Focus</span><span>Security, data, distributed systems</span>
<span class="k">Shell</span><span>AI-assisted engineering</span>
<span class="k">Edu</span><span>B.E. Computer Science, Mumbai University</span></div>
<div style="margin-top:8px"><span class="swatch" style="background:var(--green)"></span><span class="swatch" style="background:var(--blue)"></span><span class="swatch" style="background:var(--pink)"></span><span class="swatch" style="background:var(--yellow)"></span><span class="swatch" style="background:var(--orange)"></span><span class="swatch" style="background:var(--red)"></span></div>
</div></div>`.replace(/>\n</g,'><')},

  about: {d:'a bit more about me', f:() =>
`I build <span class="g">secure, large-scale systems</span>: cloud services, data pipelines and the
security engineering around them. I like turning ambiguous, cross-team problems into
shipped designs, keeping calm on live-site incidents, and helping engineers grow into
independent owners.

Off the clock I build <span class="p">small, dependable tools</span> for my own setup (backups,
file indexing, personal finance) and enter data competitions to practise forecasting.

<span class="m">Past Facebook Hacker Cup semi-finalist · Google Code Jam round 2.</span>
<span class="m">Next:</span> ${run('experience')} <span class="m">or</span> ${run('projects')}`},

  experience: {d:'where I’ve worked  (try --short)', f:(a) => {
    if (a.includes('--short') || a.includes('-s'))
      return `<div class="table">${JOBS.map(j=>`<span class="o">${j.when}</span><span><b>${j.co}</b> <span class="m">· ${j.role.split(' · ')[0]}</span></span>`).join('')}</div>`;
    return JOBS.map(j=>`<div class="job"><span class="when">${j.when}</span><div><div class="co">${j.co}</div><div class="role">${j.role}</div><ul>${j.pts.map(p=>`<li>${p}</li>`).join('')}</ul></div></div>`).join('');
  }},

  skills: {d:'tech I work with', f:() => `<span class="m">{</span>\n${SKILLS.map(([k,v],i)=>`  <span class="b">"${k}"</span>: <span class="o">"${v}"</span>${i<SKILLS.length-1?',':''}`).join('\n')}\n<span class="m">}</span>`},

  projects: {d:'side projects', f:() => PROJECTS.map(p=>`<div class="proj"><span class="name">${p.name}/</span>  <span class="tags">${p.tags.map(t=>`<span>#${t}</span>`).join('')}</span>\n  ${p.desc}${p.href?`\n  ${link(p.href,'→ view source')}`:''}</div>`).join('')},

  mythlearn: {d:'my animated mythology channel', f:() =>
`<span class="p">MythLearn</span>: short animated videos retelling stories from mythology,
made with a scripted video pipeline.
Watch on Instagram → ${link(LINKS.instagram,'@myth.learn')}`},

  contact: {d:'how to reach me', f:() => `<div class="table"><span class="g">linkedin</span>${link(LINKS.linkedin,'linkedin.com/in/ritesh-jethmalani')}<span class="g">github</span>${link(LINKS.github,'github.com/claudetourist')}<span class="g">instagram</span>${link(LINKS.instagram,'@myth.learn')}</div>
<span class="m">Type</span> ${run('open linkedin')} <span class="m">to jump straight there.</span>`},

  open: {d:'open a link  (linkedin | github | instagram)', f:(a) => {
    const k = (a[0]||'').toLowerCase();
    if (!LINKS[k]) return `<span class="m">usage: open &lt;linkedin|github|instagram&gt;</span>`;
    window.open(LINKS[k], '_blank', 'noopener'); return `<span class="g">opening ${k}…</span>`;
  }},

  ls: {d:'list files', f:() => Object.keys(FILES).map(f=>`<span class="c ${f.endsWith('/')?'b':''}" data-run="cat ${f}" style="margin-right:18px;cursor:pointer">${f}</span>`).join('')},
  cat: {d:'read a file', hidden:true, f:(a) => { const c = FILES[a[0]]; return c ? C[c].f([]) : `<span class="r">cat: ${esc(a[0]||'')}: No such file or directory</span>`; }},
  cd: {hidden:true, f:() => `<span class="m">There’s only one directory here, and you’re in it.</span>`},
  history: {d:'commands you’ve run', f:() => hist.map((h,i)=>`<span class="m">${String(i+1).padStart(3)}</span>  ${esc(h)}`).join('\n') || '<span class="m">(empty)</span>'},
  clear: {d:'clear the screen', f:() => { log.innerHTML=''; return null; }},
  date: {hidden:true, f:() => new Date().toString()},
  echo: {hidden:true, f:(a) => esc(a.join(' '))},
  sudo: {hidden:true, f:() => `<span class="r">guest is not in the sudoers file.</span> <span class="m">This incident will be reported. 🙂</span>`},
  exit: {hidden:true, f:() => `<span class="m">There is no exit. Only</span> ${run('help')}<span class="m">.</span>`},
  rm: {hidden:true, f:() => `<span class="r">Permission denied.</span> <span class="m">Nice try.</span>`},
  vim: {hidden:true, f:() => `<span class="m">You’d never get out. Try</span> ${run('about')} <span class="m">instead.</span>`},
};
C.resume = {hidden:true, f:() => `<span class="m">A downloadable resume is coming soon. Meanwhile:</span> ${run('experience')}`};
C.cv = C.resume; C.neofetch = C.whoami; C.man = C.help; C['?'] = C.help;

const hist = []; let hi = 0;
const names = () => Object.keys(C).concat(Object.keys(FILES).map(f=>'cat '+f));

function print(cmd, html){
  const row = document.createElement('div');
  row.innerHTML = `<div class="line"><span class="prompt">${PROMPT}</span> <span class="cmd">${esc(cmd)}</span></div>` +
    (html!=null && html!=='' ? `<div class="out line">${html}</div>` : '');
  log.appendChild(row);
}
function exec(raw){
  const cmd = raw.trim();
  if (cmd) { hist.push(cmd); }
  hi = hist.length;
  if (!cmd) { print('', null); return scroll(); }
  const [name, ...args] = cmd.split(/\s+/);
  const c = C[name.toLowerCase()];
  if (name.toLowerCase()==='clear') { C.clear.f(); return; }
  const out = c ? c.f(args) : `<span class="r">command not found: ${esc(name)}</span>  <span class="m">try</span> ${run('help')}`;
  print(cmd, out); scroll();
}
function scroll(){ screen.scrollTop = screen.scrollHeight; }

let busy = false;
async function typeRun(cmd){
  if (busy) return; busy = true;
  input.value = ''; ghost.textContent = '';
  if (!reduce) for (const ch of cmd){ input.value += ch; await new Promise(r=>setTimeout(r, 28+Math.random()*30)); }
  input.value = ''; exec(cmd); busy = false;
  if (matchMedia('(hover:hover)').matches) input.focus();
}

function suggest(){
  const v = input.value; ghost.textContent = '';
  if (!v) return null;
  const m = names().find(n => n.startsWith(v.toLowerCase()) && n !== v.toLowerCase());
  if (m) ghost.textContent = v + m.slice(v.length);
  return m;
}
input.addEventListener('input', suggest);
input.addEventListener('keydown', e => {
  if (busy) { e.preventDefault(); return; }
  if (e.key === 'Enter') { const v = input.value; input.value=''; ghost.textContent=''; exec(v); }
  else if (e.key === 'Tab') { e.preventDefault(); const m = suggest(); if (m) { input.value = m; ghost.textContent=''; } }
  else if (e.key === 'ArrowRight' && ghost.textContent && input.selectionStart === input.value.length) { input.value = ghost.textContent; ghost.textContent=''; }
  else if (e.key === 'ArrowUp') { e.preventDefault(); if (hi>0) { input.value = hist[--hi]; suggest(); } }
  else if (e.key === 'ArrowDown') { e.preventDefault(); if (hi<hist.length-1) input.value = hist[++hi]; else { hi=hist.length; input.value=''; } suggest(); }
  else if (e.key.toLowerCase()==='l' && e.ctrlKey) { e.preventDefault(); C.clear.f(); }
});
screen.addEventListener('click', e => {
  const t = e.target.closest('[data-run]');
  if (t) { typeRun(t.dataset.run); return; }
  if (!window.getSelection().toString() && !e.target.closest('a')) input.focus();
});

['whoami','about','experience','projects','skills','contact','mythlearn','help'].forEach(c => {
  const b = document.createElement('button'); b.className='chip'; b.type='button';
  b.innerHTML = `<b>$</b> ${c}`; b.onclick = () => typeRun(c); chips.appendChild(b);
});

// boot
(async () => {
  const welcome = document.createElement('div');
  welcome.className = 'line m';
  welcome.innerHTML = `Last login: ${new Date().toDateString()} on ttys001\nWelcome! This portfolio is a tiny shell. Type <span class="g">help</span> or tap a command below.\n\n`;
  log.appendChild(welcome);
  await new Promise(r=>setTimeout(r, reduce?0:500));
  await typeRun('whoami');
  if (!matchMedia('(hover:hover)').matches) screen.scrollTop = 0;
})();
})();
</script>
</body>
</html>
